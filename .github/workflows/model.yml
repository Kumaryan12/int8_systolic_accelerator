name: Trained model
on: workflow_dispatch
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: make model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trained-model-evidence
          path: |
            build/run_*/summary.json
            build/run_*/model_metrics.json
            build/run_*/trained_model.json
            build/run_*/*.log
