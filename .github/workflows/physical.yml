name: SKY130 physical flow
on:
  workflow_dispatch:
    inputs:
      design:
        description: Physical top
        type: choice
        options: [axi_gemm, memory_gemm]
        default: axi_gemm
permissions:
  contents: read
jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install routed-gate simulation tools
        if: inputs.design == 'axi_gemm'
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - run: make physical PHYSICAL_DESIGN="$PHYSICAL_DESIGN"
        env:
          PHYSICAL_DESIGN: ${{ inputs.design }}
      - name: Gate three cell PVT corners at 50 MHz
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          candidates = [p.parent for p in Path('build').glob('run_*/summary.json')
                        if (r := json.loads(p.read_text())).get('suite') == 'physical'
                        and r.get('status') == 'PASS']
          if len(candidates) != 1:
              raise SystemExit('Expected exactly one successful physical run')
          subprocess.run(['python3', 'scripts/regression.py', '--suite', 'pvt',
                          '--physical-run', str(candidates[0]), '--seeds', '2026', '20261110', '42',
                          '--pvt-periods', '20',
                          '--require-timing-closure'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky130-physical-evidence
          path: |
            build/run_*/summary.json
            build/run_*/physical_metrics.json
            build/run_*/pvt_metrics.json
            build/run_*/*/*.rpt
            build/run_*/*.log
            build/run_*/logs/
            build/run_*/reports/
            build/run_*/results/sky130hd/*/base/6_final.*
